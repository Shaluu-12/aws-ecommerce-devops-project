<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shalini Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 80px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
            margin: 10px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #cart {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Shalini Store</h1>
    <p>Simple AWS E-Commerce Demo</p>
</header>

<div class="container">

    <h2>Products</h2>

    <div class="products" id="products">

        <div class="product">
            <img src="notebook.jpg" alt="Notebook" style="width: 100%; max-width: 200px; border-radius: 8px;">
            <h3>Notebook</h3>
            <p>Premium ruled notebook</p>
            <div class="price">₹199</div>
            <button onclick="addToCart('Notebook', 199)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="mug.jpg" alt="Mug" style="width: 100%; max-width: 200px; border-radius: 8px;">
            <h3>Coffee Mug</h3>
            <p>Simple ceramic coffee mug</p>
            <div class="price">₹299</div>
            <button onclick="addToCart('Coffee Mug', 299)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="wall art.webp" alt="Wall Art" style="width: 100%; max-width: 200px; border-radius: 8px;">
            <h3>Wall Art</h3>
            <p>Modern decorative wall art</p>
            <div class="price">₹499</div>
            <button onclick="addToCart('Wall Art', 499)">
                Add to Cart
            </button>
        </div>

    </div>

    <div id="cart">
        <h2>🛍️ Shopping Cart</h2>
        <p id="cartItems">Your cart is empty.</p>
        <h3 id="total">Total: ₹0</h3>
    </div>

</div>

<script>
    let cart = [];
    let total = 0;

    function addToCart(name, price) {
        cart.push(name);
        total += price;

        document.getElementById("cartItems").innerText =
            cart.join(", ");

        document.getElementById("total").innerText =
            "Total: ₹" + total;
    }
async function loadProducts() {
    try {
        const response = await fetch('/api/products');
        const products = await response.json();

        const productContainer = document.getElementById("products");

        productContainer.innerHTML = products.map(product => `
            <div class="product">
                <h3>${product.name}</h3>
                <p>Product from Flask API</p>
                <div class="price">₹${product.price}</div>
                <button onclick="addToCart('${product.name}', ${product.price})">
                    Add to Cart
                </button>
            </div>
        `).join("");

    } catch (error) {
        console.error("Error loading products:", error);
    }
}

loadProducts();
</script>

</body>
</html>
